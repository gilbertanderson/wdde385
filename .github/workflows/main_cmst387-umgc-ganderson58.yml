name: Build and deploy Node.js app to Azure Web App - CMST387-UMGC-ganderson58

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: npm install and build (skipped entirely if there is no package.json)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          else
            echo "No package.json, deploying static files as-is."
          fi

      # Compiles scss/styles.scss -> styles.css. This is the one build step
      # the site has (see about.html#how-built): a single compiler run, not
      # a framework the browser has to load. The compiled file is also
      # committed to the repo so the site still renders correctly for
      # anyone viewing it without a Sass toolchain; CI recompiles here so a
      # forgotten local recompile can never ship stale CSS.
      - name: Compile SCSS
        run: npx --yes sass scss/styles.scss:styles.css --no-source-map --style=expanded

      - name: Zip artifact for deployment
        run: zip -r release.zip . -x '.git/*' '.github/*' 'docs/*' 'scss/*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  # Automated WCAG 2.2 AA scanning, per Section 5 of the project proposal.
  # Deliberately NOT a dependency of `deploy`: a11y findings surface as a failed
  # check without blocking a release. To gate deploys on it, add `accessibility`
  # to the deploy job's `needs` list below.
  accessibility:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Compile SCSS
        run: npx --yes sass scss/styles.scss:styles.css --no-source-map --style=expanded

      - name: Serve the site
        run: |
          python3 -m http.server 8080 &
          npx --yes wait-on http://localhost:8080/index.html --timeout 30000

      - name: Run pa11y-ci (WCAG 2.2 AA)
        run: npx --yes pa11y-ci --config .github/pa11yci.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip && rm release.zip

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CMST387-UMGC-ganderson58'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_CMST387 }}
          package: .
