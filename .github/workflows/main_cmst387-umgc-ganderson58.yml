name: Build and deploy Node.js app to Azure Web App - CMST387-UMGC-ganderson58

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: npm install and build (skipped entirely if there is no package.json)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          else
            echo "No package.json — deploying static files as-is."
          fi

      - name: Zip artifact for deployment
        run: zip -r release.zip . -x '.git/*' '.github/*' 'docs/*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip && rm release.zip

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CMST387-UMGC-ganderson58'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_CMST387 }}
          package: .
