<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" width="1120" height="860" font-family="Helvetica, Arial, sans-serif">
  <rect width="1120" height="860" fill="#ffffff"/>

  <text x="40" y="38" font-size="22" font-weight="bold" fill="#111">Wireframe 3 — Contact Page (Responsive Form)</text>
  <text x="40" y="60" font-size="13" fill="#555">Required feature · demonstrates accessible form patterns from Section 9</text>

  <!-- ================= DESKTOP ================= -->
  <text x="40" y="92" font-size="13" font-weight="bold" fill="#333">DESKTOP — 1280px and above</text>
  <rect x="40" y="102" width="700" height="700" fill="#fafafa" stroke="#333" stroke-width="2"/>

  <rect x="52" y="112" width="676" height="46" fill="#eee" stroke="#666"/>
  <rect x="64" y="124" width="110" height="22" fill="#ddd" stroke="#888"/>
  <text x="70" y="139" font-size="9.5" fill="#444">LOGO / Site name</text>
  <text x="300" y="132" font-size="10" fill="#444">UX</text>
  <text x="336" y="132" font-size="10" fill="#444">Accessibility</text>
  <text x="416" y="132" font-size="10" fill="#444">Security</text>
  <text x="476" y="132" font-size="10" fill="#444">Optimization</text>
  <text x="556" y="132" font-size="10" fill="#444">Responsive</text>
  <text x="632" y="132" font-size="10" font-weight="bold" fill="#111">Contact</text>
  <rect x="628" y="140" width="50" height="3" fill="#e8710a"/>

  <rect x="52" y="166" width="676" height="22" fill="#f4f4f4" stroke="#ccc"/>
  <text x="62" y="181" font-size="9.5" fill="#666">Home  ›  Contact</text>

  <text x="52" y="212" font-size="16" font-weight="bold" fill="#333">H1 — Contact</text>
  <rect x="52" y="222" width="480" height="8" fill="#d8d8d8"/>
  <rect x="52" y="236" width="420" height="8" fill="#d8d8d8"/>
  <text x="52" y="260" font-size="8.5" fill="#888">Plain-language intro: what this form is for and when to expect a reply</text>

  <!-- error summary -->
  <rect x="52" y="272" width="480" height="54" fill="#fdecea" stroke="#c62828" stroke-width="1.8"/>
  <text x="62" y="290" font-size="10" font-weight="bold" fill="#c62828">There are 2 problems with this form</text>
  <text x="62" y="305" font-size="9" fill="#c62828">• Email address is not in a valid format  (jump to field)</text>
  <text x="62" y="318" font-size="9" fill="#c62828">• Message field is empty  (jump to field)</text>
  <text x="546" y="292" font-size="8.5" fill="#a01818">Appears above the form on</text>
  <text x="546" y="304" font-size="8.5" fill="#a01818">submit failure. Focus moves</text>
  <text x="546" y="316" font-size="8.5" fill="#a01818">here; each item links to its</text>
  <text x="546" y="328" font-size="8.5" fill="#a01818">field. WCAG 3.3.1 / 3.3.3</text>

  <!-- form fields -->
  <text x="52" y="352" font-size="10" fill="#333">Your name</text>
  <rect x="52" y="358" width="330" height="30" fill="#fff" stroke="#666" stroke-width="1.4"/>
  <text x="392" y="378" font-size="8.5" fill="#888">single field — no first/last split (Section 6)</text>

  <text x="52" y="410" font-size="10" fill="#333">Email address</text>
  <rect x="52" y="416" width="330" height="30" fill="#fff" stroke="#c62828" stroke-width="2"/>
  <text x="392" y="428" font-size="8.5" fill="#c62828">aria-invalid="true"</text>
  <text x="52" y="460" font-size="9" fill="#c62828">✕ Enter an email address like name@example.com</text>
  <text x="392" y="440" font-size="8.5" fill="#888">error names the fix, not just the fault</text>

  <text x="52" y="486" font-size="10" fill="#333">What is this about?</text>
  <rect x="52" y="492" width="330" height="30" fill="#fff" stroke="#666" stroke-width="1.4"/>
  <text x="62" y="512" font-size="9" fill="#555">Select a category…</text>
  <text x="366" y="512" font-size="9" fill="#666">▾</text>
  <text x="392" y="512" font-size="8.5" fill="#888">routes accessibility reports separately</text>

  <text x="52" y="544" font-size="10" fill="#333">Your message</text>
  <rect x="52" y="550" width="480" height="94" fill="#fff" stroke="#666" stroke-width="1.4"/>
  <text x="392" y="572" font-size="8.5" fill="#888">no character countdown</text>
  <text x="392" y="584" font-size="8.5" fill="#888">that blocks typing</text>
  <text x="52" y="660" font-size="8.5" fill="#666">Every input: &lt;label&gt; programmatically associated · aria-describedby for format hints · autocomplete attributes (WCAG 1.3.5)</text>

  <!-- submit -->
  <rect x="52" y="676" width="150" height="38" fill="#ddd" stroke="#333" stroke-width="1.8"/>
  <text x="86" y="700" font-size="11" font-weight="bold" fill="#222">Send message</text>
  <text x="214" y="694" font-size="8.5" fill="#888">44×44 target · entered data preserved on error</text>
  <text x="214" y="707" font-size="8.5" fill="#b35505">No CAPTCHA — honeypot + server-side validation instead (Section 9)</text>

  <!-- alternatives -->
  <rect x="52" y="726" width="676" height="42" fill="#fff8ee" stroke="#e8710a" stroke-width="1.5"/>
  <text x="62" y="744" font-size="9.5" font-weight="bold" fill="#b35505">Can't use this form?</text>
  <text x="62" y="758" font-size="9" fill="#a06030">Email · GitHub issue tracker · alternative contact — a user blocked by the form needs another route to say so (Section 7)</text>

  <text x="52" y="788" font-size="9" fill="#888">Confirmation on success announced via ARIA live region (polite), not a visual-only state change</text>

  <!-- ================= MOBILE ================= -->
  <text x="790" y="92" font-size="13" font-weight="bold" fill="#333">MOBILE — 375px</text>
  <rect x="790" y="102" width="290" height="700" fill="#fafafa" stroke="#333" stroke-width="2"/>

  <rect x="802" y="114" width="266" height="36" fill="#eee" stroke="#666"/>
  <rect x="810" y="122" width="80" height="20" fill="#ddd" stroke="#888"/>
  <text x="816" y="136" font-size="8.5" fill="#444">LOGO</text>
  <rect x="1002" y="120" width="58" height="24" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="1010" y="136" font-size="9" fill="#333">☰ Menu</text>

  <rect x="802" y="158" width="266" height="22" fill="#f4f4f4" stroke="#ccc"/>
  <text x="810" y="173" font-size="8.5" fill="#666">Home › Contact</text>

  <text x="802" y="204" font-size="13" font-weight="bold" fill="#333">H1 — Contact</text>
  <rect x="802" y="212" width="240" height="7" fill="#d8d8d8"/>
  <rect x="802" y="224" width="210" height="7" fill="#d8d8d8"/>

  <rect x="802" y="242" width="266" height="46" fill="#fdecea" stroke="#c62828" stroke-width="1.6"/>
  <text x="810" y="259" font-size="9" font-weight="bold" fill="#c62828">2 problems with this form</text>
  <text x="810" y="272" font-size="8" fill="#c62828">• Email not valid  (jump)</text>
  <text x="810" y="283" font-size="8" fill="#c62828">• Message is empty  (jump)</text>

  <text x="802" y="308" font-size="9.5" fill="#333">Your name</text>
  <rect x="802" y="314" width="266" height="34" fill="#fff" stroke="#666" stroke-width="1.4"/>

  <text x="802" y="370" font-size="9.5" fill="#333">Email address</text>
  <rect x="802" y="376" width="266" height="34" fill="#fff" stroke="#c62828" stroke-width="2"/>
  <text x="802" y="424" font-size="8.5" fill="#c62828">✕ Enter an email like name@example.com</text>

  <text x="802" y="450" font-size="9.5" fill="#333">What is this about?</text>
  <rect x="802" y="456" width="266" height="34" fill="#fff" stroke="#666" stroke-width="1.4"/>
  <text x="810" y="478" font-size="8.5" fill="#555">Select a category…</text>
  <text x="1050" y="478" font-size="9" fill="#666">▾</text>

  <text x="802" y="512" font-size="9.5" fill="#333">Your message</text>
  <rect x="802" y="518" width="266" height="110" fill="#fff" stroke="#666" stroke-width="1.4"/>

  <rect x="802" y="644" width="266" height="42" fill="#ddd" stroke="#333" stroke-width="1.8"/>
  <text x="878" y="670" font-size="10.5" font-weight="bold" fill="#222">Send message</text>
  <text x="802" y="700" font-size="8" fill="#888">Full-width button · inputs stack single column</text>
  <text x="802" y="713" font-size="8" fill="#888">Correct inputmode/type so mobile shows the</text>
  <text x="802" y="726" font-size="8" fill="#888">right keyboard (email keyboard for email)</text>

  <rect x="802" y="738" width="266" height="42" fill="#fff8ee" stroke="#e8710a" stroke-width="1.5"/>
  <text x="810" y="755" font-size="9" font-weight="bold" fill="#b35505">Can't use this form?</text>
  <text x="810" y="770" font-size="8.5" fill="#a06030">Email · GitHub issues · alt contact</text>

  <!-- legend -->
  <rect x="40" y="812" width="1040" height="34" fill="#fcfcfc" stroke="#ccc"/>
  <rect x="52" y="822" width="16" height="12" fill="#fdecea" stroke="#c62828" stroke-width="1.6"/>
  <text x="76" y="832" font-size="9.5" fill="#555">Error state (shown here deliberately — error handling is the form's hardest accessibility problem)</text>
  <rect x="612" y="822" width="16" height="12" fill="#fff8ee" stroke="#e8710a" stroke-width="1.5"/>
  <text x="636" y="832" font-size="9.5" fill="#555">Accessibility-specific feature</text>
  <rect x="852" y="822" width="16" height="12" fill="#fff" stroke="#666" stroke-width="1.4"/>
  <text x="876" y="832" font-size="9.5" fill="#555">Form input</text>
</svg>
